<!DOCTYPE html>
<html>
<head>
    <title>Virus Prank</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
        }

        #warning {
            color: red;
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            margin-top: 40px;
            animation: blink 0.4s infinite;
        }

        #terminal {
            padding: 20px;
            height: 60vh;
            overflow: hidden;
        }

        button {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 20px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .popup {
            position: fixed;
            background: black;
            color: red;
            border: 3px solid red;
            padding: 25px;
            font-size: 25px;
            font-weight: bold;
            z-index: 999;
            animation: shake 0.15s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.2;
            }
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
    </style>
</head>

<body>

<div id="warning">
    ⚠ SYSTEM COMPROMISED ⚠
</div>

<div id="terminal"></div>

<button onclick="stopPrank()">STOP</button>

<script>

let terminal = document.getElementById("terminal");

let messages = [
    "[CRITICAL] Virus detected",
    "[WARNING] Scanning system...",
    "[ERROR] Unknown process detected",
    "[CRITICAL] System compromised",
    "[WARNING] Security failure",
    "[ERROR] Recovery failed"
];

setInterval(function() {

    let line = document.createElement("div");

    line.textContent =
        "> " + messages[Math.floor(Math.random() * messages.length)];

    terminal.appendChild(line);

    if (terminal.children.length > 20) {
        terminal.removeChild(terminal.firstChild);
    }

}, 300);


function stopPrank() {

    createPopup("SUPOT SI JUSTIN 😂");

    setTimeout(function() {
        createPopup("SUPOT SI CHAZZ 😂");
    }, 500);

}


function createPopup(text) {

    let popup = document.createElement("div");

    popup.className = "popup";
    popup.textContent = text;

    popup.style.left =
        Math.random() * 65 + 10 + "%";

    popup.style.top =
        Math.random() * 60 + 10 + "%";

    document.body.appendChild(popup);

    setTimeout(function() {
        popup.remove();
    }, 2000);

}

</script>

</body>
    </html>
