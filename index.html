<!DOCTYPE html>
<html>
<head>
    <title>Jhun Rey Pogi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
        }

        #warning {
            color: red;
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin-top: 40px;
            animation: blink 0.4s infinite;
        }

        #terminal {
            padding: 20px;
            height: 60vh;
            overflow: hidden;
            text-align: center;
            font-size: 30px;
            line-height: 1.6;
            font-weight: bold;
        }

        button {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 20px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .popup {
            position: fixed;
            background: black;
            color: red;
            border: 3px solid red;
            padding: 25px;
            font-size: 30px;
            font-weight: bold;
            z-index: 999;
            text-align: center;
            animation: shake 0.15s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.2;
            }
        }

        @keyframes shake {
            0% {
                transform: translate(2px, 2px);
            }

            50% {
                transform: translate(-2px, -2px);
            }

            100% {
                transform: translate(2px, -2px);
            }
        }
    </style>
</head>

<body>

<div id="warning">
    ⚠ SYSTEM COMPROMISED ⚠
</div>

<div id="terminal"></div>

<button onclick="stopPrank()">STOP</button>

<script>

let terminal = document.getElementById("terminal");

let messages = [
    "[CRITICAL] VIRUS DETECTED",
    "[WARNING] SCANNING SYSTEM...",
    "[ERROR] UNKNOWN PROCESS DETECTED",
    "[CRITICAL] SYSTEM COMPROMISED",
    "[WARNING] SECURITY FAILURE",
    "[ERROR] RECOVERY FAILED",
    "[CRITICAL] UNAUTHORIZED ACCESS"
];

setInterval(function() {

    let line = document.createElement("div");

    line.textContent =
        "> " + messages[Math.floor(Math.random() * messages.length)];

    terminal.appendChild(line);

    if (terminal.children.length > 12) {
        terminal.removeChild(terminal.firstChild);
    }

}, 300);

function stopPrank() {

    createPopup("SUPOT SI JUSTIN 😂");

    setTimeout(function() {
        createPopup("SUPOT SI CHAZZ 😂");
    }, 500);

}

function createPopup(text) {

    let popup = document.createElement("div");

    popup.className = "popup";
    popup.textContent = text;

    popup.style.left =
        Math.random() * 60 + 15 + "%";

    popup.style.top =
        Math.random() * 60 + 10 + "%";

    document.body.appendChild(popup);

    setTimeout(function() {
        popup.remove();
    }, 2000);
}

</script>

</body>
</html>
